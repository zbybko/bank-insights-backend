spring.application.name=backend

bankinsights.csv-path=${REVOLUT_CSV_PATH}

server.address=0.0.0.0

bankinsights.ai.gateway-url=${ASTRO_GATEWAY_URL}
bankinsights.ai.api-key=${ASTRO_GATEWAY_API_KEY}
bankinsights.ai.model=gpt-5-6-luna

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.devtools.restart.additional-exclude=db/migration/**

bankinsights.web.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082}
