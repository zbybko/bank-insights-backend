{
  "id": "45223050-0e1f5a7c-6e07-4c76-85dc-aeefefb39d40",
  "name": "Confirm income meaning",
  "description": "Completed positive transaction only. 400 for outgoing/pending, 404 for missing transaction. Income meaning is independent of spending category. POST explicitly calls AI once; GET before assessment returns 404. Payroll suggestions require confirmation. PATCH does not call AI.",
  "url": "{{baseURL1}}/api/transactions/{{income_transaction_id}}/income",
  "method": "PATCH",
  "headers": [
    {
      "key": "Accept",
      "value": "application/json"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"type\": \"{{income_type}}\"\n}"
  },
  "$kind": "http-request",
  "scripts": [
    {
      "type": "beforeRequest",
      "code": "if (!/^[0-9a-f-]{36}$/i.test(pm.variables.get('income_transaction_id') || '')) { pm.execution.skipRequest(); throw new Error('Set income_transaction_id to an intended incoming transaction.'); }",
      "language": "text/javascript"
    },
    {
      "type": "afterResponse",
      "code": "pm.test('Status is 200', () => pm.response.to.have.status(200)); pm.test('Assessment matches transaction', () => { const a=pm.response.json(); pm.expect(a.transactionId).to.eql(pm.variables.get('income_transaction_id')); pm.expect(a.reviewRequired).to.be.a('boolean'); }); pm.test('User confirmation stored', () => { const a=pm.response.json(); pm.expect(a.source).to.eql('USER'); pm.expect(a.type).to.eql(pm.variables.get('income_type')); pm.expect(a.reviewRequired).to.eql(false); });",
      "language": "text/javascript"
    }
  ]
}
